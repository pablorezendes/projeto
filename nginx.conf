worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    client_max_body_size 1k;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    log_format presentation '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout presentation;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name projeto.tescod.com;
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' blob:; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /modelo/THIRD-PARTY-LICENSE.txt {
            default_type text/plain;
            expires -1;
            try_files $uri =404;
        }

        # Defense in depth: protected material is also excluded from the image.
        location ~ (^|/)\. {
            return 404;
        }

        location ~* (^|/)(01_documentos|02_corte|03_modelo3d|04_desenhos|06_codigo|arquivos|documentos|docs|manuais|scripts|source|sources|engenharia)(/|$) {
            return 404;
        }

        location ~* \.(dxf|dwg|stp|step|iges|igs|stl|obj|mtl|blend|f3d|fcstd|scad|csv|tsv|xlsx?|docx?|pdf|zip|7z|rar|tar|gz|bak|sql|py|sh|ps1|map|ya?ml|toml|ini|env|md|txt)$ {
            return 404;
        }

        location ~* \.(avif|webp|jpe?g|png|gif|svg|ico|woff2?)$ {
            expires 7d;
            try_files $uri =404;
        }

        location / {
            # HTML and unhashed scripts/styles always revalidate on updates.
            expires -1;
            try_files $uri $uri/ =404;
        }
    }
}
